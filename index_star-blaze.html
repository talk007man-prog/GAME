<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Star Blaze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05030f;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
#menuLink{position:fixed;top:14px;left:14px;z-index:5;padding:8px 14px;font:700 13px 'Orbitron','Malgun Gothic',sans-serif;letter-spacing:2px;color:#9fd8ff;text-decoration:none;border:1px solid rgba(80,200,255,.55);border-radius:8px;background:rgba(5,3,20,.6);box-shadow:0 0 12px rgba(60,200,255,.25);transition:color .2s,box-shadow .2s,background .2s}
#menuLink:hover{color:#fff;background:rgba(40,20,90,.75);box-shadow:0 0 22px rgba(255,60,220,.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="menuLink" href="index.html">◀ MENU</a>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, bgGrad, vignette;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0a0322'); bgGrad.addColorStop(.55, '#070418'); bgGrad.addColorStop(1, '#02010a');
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,.65)');
}
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const FONT = "'Orbitron','Segoe UI','Malgun Gothic',sans-serif";
const KFONT = "'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif";

/* ================= AUDIO ================= */
let AC = null, MG = null, NB = null, lastShotS = 0, lastBoomS = 0;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MG = AC.createGain(); MG.gain.value = .45; MG.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f1, f2, dur, vol) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t, Math.random()); s.stop(t + dur);
}
const sfx = {
  shot() { if (!AC || AC.currentTime - lastShotS < .09) return; lastShotS = AC.currentTime; tone('square', 1100, 320, .06, .02); },
  boom(s) { if (!AC || AC.currentTime - lastBoomS < .04) return; lastBoomS = AC.currentTime; noise(.25 + s * .2, Math.min(.5, .15 + s * .1), 900 + s * 200); if (s > 1.4) tone('sine', 140, 30, .5, .35); },
  pickup() { tone('sine', 620, 1500, .18, .15); tone('triangle', 900, 2000, .12, .06); },
  gem() { tone('sine', 1500 + Math.random() * 400, 2200, .05, .02); },
  hurt() { tone('sawtooth', 380, 50, .6, .2); noise(.8, .4, 1400); },
  bomb() { noise(1.4, .6, 500); tone('sine', 90, 20, 1.2, .5); },
  warn() { tone('square', 520, 500, .25, .06); },
  dash() { tone('sawtooth', 200, 800, .15, .025); },
  shield() { tone('triangle', 300, 1200, .3, .12); }
};

/* ================= INPUT ================= */
const keys = {};
const ptr = { down: false, lx: 0, ly: 0, dx: 0, dy: 0 };
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  initAudio();
  if (e.code === 'KeyM' && state !== 'play') { location.href = 'index.html'; return; }
  if ((e.code === 'Space' || e.code === 'Enter') && canStart()) { startGame(); return; }
  if (state === 'play' && (e.code === 'KeyX' || e.code === 'KeyB')) bomb();
  if (state === 'play' && (e.code === 'KeyP' || e.code === 'Escape')) paused = !paused;
});
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (canStart()) { startGame(); return; }
  if (state === 'play') {
    if (Math.hypot(e.clientX - (W - 62), e.clientY - (H - 62)) < 40) { bomb(); return; }
    if (paused) { paused = false; return; }
  }
  ptr.down = true; ptr.lx = e.clientX; ptr.ly = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!ptr.down) return;
  ptr.dx += (e.clientX - ptr.lx) * 1.25; ptr.dy += (e.clientY - ptr.ly) * 1.25;
  ptr.lx = e.clientX; ptr.ly = e.clientY;
});
const ptrUp = () => ptr.down = false;
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
addEventListener('blur', () => { if (state === 'play') paused = true; for (const k in keys) keys[k] = false; });

/* ================= STATE ================= */
let state = 'title', paused = false, T = 0, stateT = 0;
let P = null, bullets = [], ebullets = [], enemies = [], parts = [], pickups = [], texts = [];
let score = 0, dispScore = 0, scoreBump = 0, lives = 3, wave = 0, waveTime = 0, waveDur = 0, spawnT = 0;
let isBossWave = false, bossPending = 0, bossRef = null, waveClear = false, clearT = 0;
let combo = 0, comboT = 0, comboPop = 0, maxCombo = 0;
let shakeAmt = 0, flashA = 0, flashCol = '255,255,255', timeScale = 1, slowT = 0, warp = 0;
let banner = null, bombT = 0, bombX = 0, bombY = 0, gameOverT = 0, bossHpLag = 1;
let best = 0; try { best = +localStorage.getItem('starblaze-best') || 0; } catch (_) {}
const canStart = () => state === 'title' || (state === 'over' && stateT > 1.2);

function startGame() {
  P = { x: W / 2, y: H + 60, vx: 0, vy: 0, tilt: 0, power: 1, inv: 3, fireCD: 0, missCD: 0, shield: 0, bombs: 3, alive: true, respawn: 0, enter: 1 };
  bullets = []; ebullets = []; enemies = []; pickups = []; texts = [];
  score = 0; dispScore = 0; lives = 3; wave = 0; combo = 0; comboT = 0; maxCombo = 0; bossRef = null;
  waveClear = false; gameOverT = 0; paused = false; state = 'play'; stateT = 0;
  flashA = .5; flashCol = '120,220,255';
  nextWave();
}
function nextWave() {
  wave++; waveTime = 0; spawnT = 2; waveDur = 22 + wave * 2;
  isBossWave = wave % 4 === 0; warp = 1.6;
  if (isBossWave) { bossPending = 3.2; banner = { t: 0, dur: 3.2, kind: 'warn', text: 'WARNING', sub: '거대 전함 접근 중' }; }
  else banner = { t: 0, dur: 2.6, kind: 'wave', text: 'WAVE ' + wave, sub: ['적 편대를 격추하라', '적의 공세가 거세진다', '집중 포화 주의', '한계를 돌파하라'][(wave - 1) % 4] };
}

/* ================= BACKGROUND ================= */
const stars = Array.from({ length: 240 }, () => ({ x: Math.random(), y: Math.random(), z: rand(.15, 1), tw: rand(0, TAU) }));
const nebulae = [
  { x: .2, y: .3, r: .55, c: '120,40,255' }, { x: .8, y: .7, r: .5, c: '255,40,140' }, { x: .5, y: -.2, r: .6, c: '20,140,255' }
];
let planet = { x: .78, y: .25, r: 90, h: 260 };
function updateBG(dt) {
  const sp = 1 + warp * 10 + (state === 'title' ? 1.5 : 0);
  for (const s of stars) {
    s.y += s.z * s.z * .22 * sp * dt;
    if (s.y > 1.05) { s.y -= 1.1; s.x = Math.random(); }
  }
  for (const n of nebulae) { n.y += .012 * dt * (1 + warp * 2); if (n.y - n.r > 1.1) { n.y = -n.r - .1; n.x = Math.random(); } }
  planet.y += (14 + warp * 60) * dt / H;
  if (!isFinite(planet.y) || planet.y * H - planet.r * 2 > H) { planet.r = rand(50, 130); planet.y = -planet.r * 2.5 / H; planet.x = rand(.1, .9); planet.h = rand(0, 360); }
  warp = Math.max(0, warp - dt * .9);
}
function drawBG() {
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const M = Math.max(W, H);
  for (const n of nebulae) {
    const g = ctx.createRadialGradient(n.x * W, n.y * H, 0, n.x * W, n.y * H, n.r * M);
    g.addColorStop(0, `rgba(${n.c},.16)`); g.addColorStop(.5, `rgba(${n.c},.05)`); g.addColorStop(1, `rgba(${n.c},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'source-over';
  // planet
  const px = planet.x * W, py = planet.y * H, pr = planet.r;
  const pg = ctx.createRadialGradient(px - pr * .4, py - pr * .4, pr * .1, px, py, pr);
  pg.addColorStop(0, `hsla(${planet.h},70%,60%,.55)`); pg.addColorStop(.7, `hsla(${planet.h + 30},60%,25%,.5)`); pg.addColorStop(1, `hsla(${planet.h + 40},60%,8%,.5)`);
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
  ctx.strokeStyle = `hsla(${planet.h + 180},80%,75%,.25)`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(px, py, pr * 1.8, pr * .35, -.3, 0, TAU); ctx.stroke();
  // stars
  const sp = 1 + warp * 10 + (state === 'title' ? 1.5 : 0);
  ctx.lineCap = 'round';
  for (const s of stars) {
    const x = s.x * W, y = s.y * H, len = s.z * s.z * (1.5 + sp * 4);
    const a = s.z * (.55 + .45 * Math.sin(T * 3 + s.tw));
    ctx.strokeStyle = s.z > .8 ? `rgba(190,230,255,${a})` : `rgba(255,255,255,${a * .8})`;
    ctx.lineWidth = s.z * 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - len); ctx.stroke();
  }
}

/* ================= PARTICLES ================= */
function P_(o) { if (parts.length < 1800) parts.push(o); }
function explode(x, y, s = 1, col = '#ffb347') {
  P_({ k: 'glow', x, y, vx: 0, vy: 0, life: .22, max: .22, size: 45 * s, col: '#fff' });
  P_({ k: 'ring', x, y, life: .5, max: .5, size: 55 * s, col, lw: 7 * s });
  if (s > 1.4) P_({ k: 'ring', x, y, life: .9, max: .9, size: 130 * s, col: '#fff', lw: 3 });
  const n = Math.min(70, 16 * s | 0);
  const cols = ['#fff', '#ffe58a', col, '#ff7b3c'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(120, 560) * Math.sqrt(s);
    P_({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.25, .7), max: .7, size: rand(1.5, 3), col: cols[i % 4], drag: .03 });
  }
  for (let i = 0; i < 7 * s; i++) {
    const a = rand(0, TAU), v = rand(20, 160) * Math.sqrt(s);
    P_({ k: 'glow', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.3, .7), max: .7, size: rand(8, 22) * s, col: i % 2 ? col : '#ffcf6b', drag: .08 });
  }
  for (let i = 0; i < 5 * s; i++) {
    const a = rand(0, TAU), v = rand(10, 70) * s;
    P_({ k: 'smoke', x: x + rand(-10, 10) * s, y: y + rand(-10, 10) * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v + 40, life: rand(.8, 1.5), max: 1.5, size: rand(10, 22) * s, col: '#3a3350', drag: .2 });
  }
  for (let i = 0; i < 6 * s; i++) {
    const a = rand(0, TAU), v = rand(80, 320);
    P_({ k: 'debris', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.5, 1.1), max: 1.1, size: rand(2, 6), col, rot: rand(0, TAU), vr: rand(-15, 15), drag: .15 });
  }
  shakeAmt = Math.min(32, shakeAmt + 4 * s);
  sfx.boom(s);
}
function sparks(x, y, n, col, sp = 250) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(60, sp);
    P_({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.1, .3), max: .3, size: 1.5, col, drag: .02 });
  }
}
function popText(x, y, txt, col = '#fff', size = 18, life = 1) { texts.push({ x, y, txt, col, size, t: 0, life }); }
function updateParts(dt) {
  for (const p of parts) {
    p.life -= dt;
    if (p.drag) { const f = Math.pow(p.drag, dt); p.vx *= f; p.vy *= f; }
    p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt;
    if (p.vr) p.rot += p.vr * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.t += dt; t.y -= 40 * dt; }
  texts = texts.filter(t => t.t < t.life);
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'smoke') {
      ctx.globalAlpha = a * .45; ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.8 - a * .8), 0, TAU); ctx.fill();
    } else if (p.k === 'debris') {
      ctx.globalAlpha = a; ctx.fillStyle = p.col;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    }
  }
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'spark') {
      ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); ctx.stroke();
    } else if (p.k === 'glow') {
      ctx.globalAlpha = a * .8; ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.1, p.size * a), 0, TAU); ctx.fill();
    } else if (p.k === 'ring') {
      const e = easeOutCubic(1 - a);
      ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = Math.max(.5, p.lw * a);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * e + 2, 0, TAU); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const s = t.t < .18 ? easeOutBack(t.t / .18) : 1;
    ctx.globalAlpha = clamp((t.life - t.t) / .3, 0, 1);
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(s, s);
    ctx.font = `900 ${t.size}px ${FONT}`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(t.txt, 0, 0);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ================= PLAYER ================= */
function drawPlayer(x, y, tilt, alpha = 1, scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale((1 - Math.abs(tilt) * .35) * scale, scale); ctx.globalAlpha = alpha;
  // engine flames
  ctx.globalCompositeOperation = 'lighter';
  for (const ex of [-7, 7]) {
    const fl = 16 + Math.sin(T * 70 + ex) * 4 + Math.random() * 8 + warp * 14;
    const g = ctx.createLinearGradient(0, 14, 0, 14 + fl);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.3, 'rgba(90,210,255,.9)'); g.addColorStop(1, 'rgba(40,60,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(ex - 4.5, 14); ctx.quadraticCurveTo(ex, 14 + fl * 1.3, ex + 4.5, 14); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowColor = '#3cf'; ctx.shadowBlur = 16;
  const bg = ctx.createLinearGradient(-22, 0, 22, 0);
  bg.addColorStop(0, tilt > 0 ? '#1a6f9e' : '#bdf3ff'); bg.addColorStop(.5, '#e8fbff'); bg.addColorStop(1, tilt < 0 ? '#1a6f9e' : '#bdf3ff');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(0, -26); ctx.lineTo(6, -8); ctx.lineTo(24, 8); ctx.lineTo(22, 15); ctx.lineTo(8, 12); ctx.lineTo(6, 18);
  ctx.lineTo(-6, 18); ctx.lineTo(-8, 12); ctx.lineTo(-22, 15); ctx.lineTo(-24, 8); ctx.lineTo(-6, -8); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  // accents
  ctx.fillStyle = '#20b8ff';
  ctx.beginPath(); ctx.moveTo(10, 4); ctx.lineTo(23, 10); ctx.lineTo(22, 14); ctx.lineTo(9, 10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-10, 4); ctx.lineTo(-23, 10); ctx.lineTo(-22, 14); ctx.lineTo(-9, 10); ctx.fill();
  // cockpit
  const cg = ctx.createLinearGradient(0, -14, 0, 4);
  cg.addColorStop(0, '#9ff'); cg.addColorStop(1, '#03246b');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.ellipse(0, -5, 3.6, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(-1, -9, 1, 3, 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function updatePlayer(dt) {
  if (!P.alive) {
    P.respawn -= dt;
    if (P.respawn <= 0 && lives > 0) { P.alive = true; P.x = W / 2; P.y = H + 60; P.enter = .9; P.inv = 2.8; ptr.dx = ptr.dy = 0; }
    return;
  }
  P.inv -= dt;
  const px = P.x;
  if (P.enter > 0) { P.enter -= dt; P.y = lerp(P.y, H * .8, Math.min(1, dt * 6)); ptr.dx = ptr.dy = 0; }
  else {
    let ix = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let iy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (ix && iy) { ix *= .707; iy *= .707; }
    const k = Math.min(1, dt * 14);
    P.vx = lerp(P.vx, ix * 460, k); P.vy = lerp(P.vy, iy * 460, k);
    P.x += P.vx * dt + ptr.dx; P.y += P.vy * dt + ptr.dy; ptr.dx = ptr.dy = 0;
    P.x = clamp(P.x, 22, W - 22); P.y = clamp(P.y, 30, H - 26);
  }
  const rv = dt > 0 ? (P.x - px) / dt : 0;
  P.tilt = lerp(P.tilt, clamp(rv / 500, -1, 1), Math.min(1, dt * 10));
  const sx = 1 - Math.abs(P.tilt) * .35;
  for (const ex of [-7, 7]) P_({ k: 'glow', x: P.x + ex * sx, y: P.y + 20, vx: rand(-20, 20), vy: rand(180, 300), life: .22, max: .22, size: rand(2.5, 5), col: '#38f' });
  P.fireCD -= dt;
  if (P.fireCD <= 0) { P.fireCD = .085; fire(); }
  if (P.power >= 4) {
    P.missCD -= dt;
    if (P.missCD <= 0) { P.missCD = P.power >= 5 ? .32 : .45; for (const s of [-1, 1]) bullets.push({ k: 'm', x: P.x + s * 18, y: P.y, vx: s * 220, vy: -120, dmg: 3, t: 0 }); }
  }
}
function fire() {
  const pw = P.power, x = P.x, y = P.y - 22;
  const B = (ox, a) => bullets.push({ k: 'b', x: x + ox, y: y + Math.abs(ox) * .4, vx: Math.sin(a) * 950, vy: -Math.cos(a) * 950, dmg: 1 });
  B(-5, 0); B(5, 0);
  if (pw >= 2) { B(-12, -.07); B(12, .07); }
  if (pw >= 3) { B(-17, -.19); B(17, .19); }
  if (pw >= 5) { B(-21, -.32); B(21, .32); }
  P_({ k: 'glow', x, y: y - 2, vx: 0, vy: 0, life: .06, max: .06, size: 11, col: '#8ef' });
  sfx.shot();
}
function hitPlayer() {
  if (!P.alive || P.inv > 0 || bombT > 0) return;
  if (P.shield > 0) {

    } else if (enemies.length === 0 && !waveClear) {
      waveClear = true; clearT = 2.4;
      const bonus = wave * 1000; addScore(bonus);

    }
    if (waveClear) { clearT -= dt; if (clearT <= 0) { waveClear = false; nextWave(); } }

      gameOverT -= dt;

    }

  updateEnemies(dt); updateBullets(dt); updatePickups(dt); updateParts(dt);
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

}
function render(rdt) {

    ctx.translate(rand(-1, 1) * shakeAmt + cam, rand(-1, 1) * shakeAmt);

      const g = ctx.createRadialGradient(bombX, bombY, R * .7, bombX, bombY, R);
      g.addColorStop(0, 'rgba(255,200,120,0)'); g.addColorStop(.85, `rgba(255,140,60,${.35 * (1 - p)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(-50, -50, W + 100, H + 100); ctx.globalCompositeOperation = 'source-over';
    }
    drawPickups();
    for (const e of enemies) drawEnemy(e);
    if (P && P.alive && state === 'play') {
      const blink = P.inv > 0 && Math.sin(T * 40) > 0;
      drawPlayer(P.x, P.y, P.tilt, blink ? .35 : 1);
      if (P.shield > 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = `rgba(92,255,157,${.5 + .3 * Math.sin(T * 8)})`; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(P.x, P.y, 34 + Math.sin(T * 5) * 2, 0, TAU); ctx.stroke();
        ctx.fillStyle = 'rgba(92,255,157,.08)'; ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#f3c'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(P.x, P.y, 3, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    }
    drawBullets();
    drawParts();
    drawTexts();
    ctx.restore();
  }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (flashA > 0) { ctx.fillStyle = `rgba(${flashCol},${flashA})`; ctx.fillRect(0, 0, W, H); flashA = Math.max(0, flashA - rdt * 2.2); }
  if (state === 'play') drawHUD(rdt);
  if (state === 'play' || state === 'over') drawBanner(rdt);
  if (state === 'over') drawGameOver();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,10,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 40px ${FONT}`; ctx.fillStyle = '#fff';
    ctx.shadowColor = '#3cf'; ctx.shadowBlur = 20; ctx.fillText('PAUSED', W / 2, H / 2); ctx.shadowBlur = 0;
    ctx.font = `500 14px ${KFONT}`; ctx.fillStyle = '#9fd8ff'; ctx.fillText('P 키 또는 화면을 눌러 계속', W / 2, H / 2 + 40);
  }
}
let last = performance.now();
function loop(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) {
    if (slowT > 0) { slowT -= rdt; timeScale = lerp(timeScale, .25, Math.min(1, rdt * 14)); }
    else timeScale = lerp(timeScale, 1, Math.min(1, rdt * 3));
    const dt = rdt * timeScale; T += dt;
    update(dt, rdt);
  }
  render(paused ? 0 : rdt);
  const menuEl = document.getElementById('menuLink'), showMenu = state !== 'play' ? '' : 'none';
  if (menuEl && menuEl.style.display !== showMenu) menuEl.style.display = showMenu;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
