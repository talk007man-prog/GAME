<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Brick Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05030f;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const FONT = "'Orbitron','Segoe UI','Malgun Gothic',sans-serif";
const KFONT = "'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif";
const COLS = 12, ROWS = 10, PH = 14;

let W = 1, H = 1, DPR = 1, bgGrad = null, vignette = null;
let FX = 0, FW = 1, TOP = 74, BW = 1, BH = 1, GY = 0, PY = 0, BR = 6;
function layout() {
  FW = Math.max(1, Math.min(W - 12, 760)); FX = (W - FW) / 2;
  TOP = W < 600 ? 82 : 76;
  BW = FW / COLS; BH = Math.max(10, Math.min(BW * .46, 28, H * .4 / ROWS));
  GY = TOP + BH * 1.3;
  PY = H - clamp(H * .1, 44, 84);
  BR = clamp(FW / 100, 5, 7.5);
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0b0326'); bgGrad.addColorStop(.6, '#08041a'); bgGrad.addColorStop(1, '#02010a');
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,.6)');
  layout();
  if (P) { P.x = clamp(P.x, FX, FX + FW); P.tx = clamp(P.tx, FX, FX + FW); }
}

/* ================= AUDIO ================= */
let AC = null, MG = null, NB = null, lastBoomS = 0, lastLaserS = 0, lastWallS = 0, lastHitS = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MG = AC.createGain(); MG.gain.value = .45; MG.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f1, f2, dur, vol, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t, Math.random()); s.stop(t + dur);
}
const sfx = {
  paddle() { tone('sine', 220, 520, .12, .2); tone('triangle', 880, 440, .08, .05); },
  hit() { if (!AC || AC.currentTime - lastHitS < .03) return; lastHitS = AC.currentTime; tone('square', 900, 600, .05, .04); },
  brk(c) { if (!AC || AC.currentTime - lastHitS < .025) return; lastHitS = AC.currentTime; const f = 520 * Math.pow(1.06, Math.min(c, 24)); tone('triangle', f, f * 1.5, .13, .13); noise(.08, .06, 5000); },
  metal() { tone('square', 1900, 1500, .05, .03); tone('sine', 3200, 2700, .1, .03); },
  wall() { if (!AC || AC.currentTime - lastWallS < .05) return; lastWallS = AC.currentTime; tone('sine', 700, 500, .04, .04); },
  boom(s) { if (!AC || AC.currentTime - lastBoomS < .04) return; lastBoomS = AC.currentTime; noise(.25 + s * .2, Math.min(.5, .15 + s * .1), 900 + s * 200); if (s > 1.4) tone('sine', 140, 30, .5, .3); },
  launch() { tone('sawtooth', 200, 900, .15, .05); tone('sine', 400, 1200, .12, .08); },
  pickup() { tone('sine', 620, 1500, .18, .15); tone('triangle', 900, 2000, .12, .06); },
  laser() { if (!AC || AC.currentTime - lastLaserS < .08) return; lastLaserS = AC.currentTime; tone('square', 1500, 500, .07, .025); },
  lose() { tone('sawtooth', 380, 50, .6, .2); noise(.8, .4, 1400); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => { tone('triangle', f, f, .28, .12, i * .085); tone('sine', f * 2, f * 2, .2, .04, i * .085); }); },
  warn() { tone('square', 520, 500, .25, .06); },
  ui() { tone('sine', 900, 1300, .06, .06); }
};

/* ================= STATE ================= */
let state = 'title', paused = false, T = 0, stateT = 0;
let P = null, balls = [], bricks = [], grid = [], caps = [], lasers = [], parts = [], texts = [], fuses = [];
let score = 0, dispScore = 0, scoreBump = 0, lives = 3, stage = 0, loopN = 0;
let combo = 0, comboPop = 0, maxCombo = 0, chain = 0, chainT = 0, chainSlow = false;
let shakeAmt = 0, flashA = 0, flashCol = '255,255,255', timeScale = 1, slowT = 0;
let banner = null, clearing = false, clearT = 0, sweepY = 0, fwT = 0, gameOverT = 0, introT = 0, bgPulse = 0, laserCD = 0;
let menuHover = false, lastCapT = -9, capStack = 0;
const wallF = { l: 0, r: 0, t: 0 };
const fx = { wide: 0, laser: 0, fire: 0, slow: 0 };
let best = 0; try { best = +localStorage.getItem('bricknova-best') || 0; } catch (_) {}
const canStart = () => state === 'title' || (state === 'over' && stateT > 1.2);
const stageNum = () => loopN * STAGES.length + stage + 1;

/* ================= INPUT ================= */
const keys = {};
let ptrDown = false;
const MENU = { x: 12, y: 12, w: 98, h: 34 };
const inMenu = (x, y) => (state === 'title' || state === 'over') && x >= MENU.x && x <= MENU.x + MENU.w && y >= MENU.y && y <= MENU.y + MENU.h;
function goMenu() { sfx.ui(); location.href = 'index.html'; }
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  initAudio();
  if (e.code === 'KeyM' && (state === 'title' || state === 'over')) { goMenu(); return; }
  if ((e.code === 'Space' || e.code === 'Enter') && canStart()) { startGame(); return; }
  if (state === 'play' && (e.code === 'KeyP' || e.code === 'Escape')) { paused = !paused; return; }
  if (state === 'play' && !paused && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW')) launch();
});
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (inMenu(e.clientX, e.clientY)) { goMenu(); return; }
  if (canStart()) { startGame(); return; }
  if (state === 'play') {
    if (paused) { paused = false; return; }
    ptrDown = true; if (P) P.tx = e.clientX;
    launch();
  }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  menuHover = inMenu(e.clientX, e.clientY);
  if (state === 'play' && P && !paused && (e.pointerType === 'mouse' || ptrDown)) P.tx = e.clientX;
});
const ptrUp = () => ptrDown = false;
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
addEventListener('blur', () => { if (state === 'play') paused = true; for (const k in keys) keys[k] = false; });

/* ================= STAGES ================= */
const HEART = [
  '..222..222..',
  '.2111221112.',
  '211x1111x112',
  '211111111112',
  '.2111xx1112.',
  '..21111112..',
  '...211112...',
  '....2112....',
  '.....22.....'
];
const STAGES = [
  { name: 'NEON GATE', sub: '모든 블록을 부숴라', f: (r, c) => {
    if (r < 1 || r > 6) return null;
    if (r === 3 && (c === 2 || c === 9)) return 'x';
    return r < 3 ? '3' : r < 5 ? '2' : '1';
  } },
  { name: 'PYRAMID', sub: '피라미드를 무너뜨려라', f: (r, c) => {
    if (r > 8) return null;
    const d = Math.abs(c - 5.5);
    if (d > (r + 1) * .68) return null;
    if (r === 8 && (c === 0 || c === 11)) return 'm';
    if (r === 5 && d < 1) return 'x';
    return d < 1.5 ? '3' : d < 3.5 ? '2' : '1';
  } },
  { name: 'CHECKER', sub: '금속 블록은 부서지지 않는다', f: (r, c) => {
    if (r < 1 || r > 7) return null;
    if (r === 4) return (c % 4 === 1 || c % 4 === 2) ? 'm' : null;
    if ((r === 2 || r === 6) && (c === 5 || c === 6)) return 'x';
    return (r + c) % 2 === 0 ? String(r % 3 + 1) : null;
  } },
  { name: 'NOVA HEART', sub: '폭발 블록으로 연쇄 폭발을 노려라', f: (r, c) => {
    const row = HEART[r - 1]; if (!row) return null;
    const ch = row[c]; return ch === '.' ? null : ch;
  } },
  { name: 'ORBIT', sub: '궤도의 핵을 노려라', f: (r, c) => {
    if (r > 8) return null;
    const dx = c - 5.5, dy = (r - 4) * 1.7, d = Math.hypot(dx, dy);
    if (d < 1.3) return 'x';
    if (d < 2.7) return '3';
    if (d < 3.6) return Math.abs(dx) < 1 ? null : 'm';
    if (d < 5) return '2';
    if (d < 6.6) return (r + c) % 2 ? '1' : null;
    return null;
  } },
  { name: 'FORTRESS', sub: '요새를 돌파하라', f: (r, c) => {
    if (r > 8 || r === 0) return null;
    if (r === 8) return (c === 3 || c === 8) ? null : 'm';
    if (c === 0 || c === 11) return r >= 2 ? 'm' : null;
    if (r === 4) return 'x';
    return r < 4 ? '3' : '2';
  } }
];
const HPC = ['', '#33d6ff', '#ff3cac', '#ffc23c'];
const bcol = k => k.type === 'm' ? '#aab4cc' : k.type === 'x' ? '#ff5a3c' : HPC[clamp(k.hp, 1, 3)];
function brect(k) { return [FX + k.c * BW + 2, GY + k.r * BH + 2, BW - 4, BH - 4]; }

function startGame() {
  P = { x: W / 2, tx: W / 2, w: baseW(), vx: 0, sq: 0, sqv: 0, tilt: 0, dead: false, hitX: 0 };
  score = 0; dispScore = 0; lives = 3; loopN = 0; combo = 0; maxCombo = 0; chain = 0;
  gameOverT = 0; paused = false; state = 'play'; stateT = 0; texts = [];
  flashA = .5; flashCol = '120,220,255';
  loadStage(0);
}
function baseW() { return clamp(FW * .17, 74, 124); }
function loadStage(i) {
  stage = i; bricks = []; grid = new Array(ROWS * COLS).fill(null);
  const def = STAGES[i];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const code = def.f(r, c); if (!code) continue;
    const type = code === 'm' ? 'm' : code === 'x' ? 'x' : 'n';
    const hp = type === 'n' ? +code : 1;
    const k = { c, r, type, hp, maxhp: hp, ap: -(r * .07 + Math.abs(c - 5.5) * .04 + rand(0, .06)), flash: 0, wob: 0, seed: Math.random(), fuse: 0, landed: false };
    bricks.push(k); grid[r * COLS + c] = k;
  }
  for (const key in fx) fx[key] = 0;
  caps = []; lasers = []; fuses = []; clearing = false; combo = 0;
  balls = [newBall()]; introT = 1.4;
  if (i === 0 && loopN > 0) banner = { t: 0, dur: 2.8, kind: 'warn', text: 'LOOP ' + (loopN + 1), sub: '속도 증가! 공이 더 빨라진다' };
  else banner = { t: 0, dur: 2.6, kind: 'stage', text: 'STAGE ' + stageNum(), sub: def.name + '  ·  ' + def.sub };
}
function newBall() { return { x: P.x, y: PY - PH / 2 - BR, vx: 0, vy: 0, stuck: true, ox: rand(-12, 12), boost: 1, trail: [] }; }
function ballSpeed(b) { return clamp(H * .72, 380, 560) * (1 + loopN * .15) * b.boost * (fx.slow > 0 ? .6 : 1); }
function launch(force) {
  if (state !== 'play' || !P || P.dead || clearing) return;
  if (introT > 0 && !force) return;
  let any = false;
  for (const b of balls) {
    if (!b.stuck) continue;
    const a = clamp(b.ox / (P.w / 2), -1, 1) * .5 + rand(-.18, .18), s = ballSpeed(b);
    b.vx = Math.sin(a) * s; b.vy = -Math.cos(a) * s; b.stuck = false; any = true;
    P_({ k: 'ring', x: b.x, y: b.y, life: .4, max: .4, size: 40, col: '#7ff', lw: 4 });
    sparks(b.x, b.y, 10, '#bff', 300);
  }
  if (any) { sfx.launch(); P.sqv = 6; }
}

/* ================= PARTICLES ================= */
function P_(o) { if (parts.length < 2000) parts.push(o); }
function explode(x, y, s = 1, col = '#ffb347') {
  P_({ k: 'glow', x, y, vx: 0, vy: 0, life: .22, max: .22, size: 45 * s, col: '#fff' });
  P_({ k: 'ring', x, y, life: .5, max: .5, size: 55 * s, col, lw: 7 * s });
  if (s > 1.4) P_({ k: 'ring', x, y, life: .9, max: .9, size: 130 * s, col: '#fff', lw: 3 });
  const n = Math.min(60, 16 * s | 0), cols = ['#fff', '#ffe58a', col, '#ff7b3c'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(120, 520) * Math.sqrt(s);
    P_({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.25, .7), max: .7, size: rand(1.5, 3), col: cols[i % 4], drag: .03 });
  }
  for (let i = 0; i < 6 * s; i++) {
    const a = rand(0, TAU), v = rand(20, 160) * Math.sqrt(s);
    P_({ k: 'glow', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.3, .7), max: .7, size: rand(8, 22) * s, col: i % 2 ? col : '#ffcf6b', drag: .08 });
  }
  for (let i = 0; i < 4 * s; i++) {
    const a = rand(0, TAU), v = rand(10, 70) * s;
    P_({ k: 'smoke', x: x + rand(-10, 10) * s, y: y + rand(-10, 10) * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, life: rand(.8, 1.4), max: 1.4, size: rand(10, 20) * s, col: '#3a3350', drag: .2 });
  }
  shakeAmt = Math.min(30, shakeAmt + 4 * s);
  sfx.boom(s);
}
function sparks(x, y, n, col, sp = 250) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(60, sp);
    P_({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.1, .3), max: .3, size: 1.5, col, drag: .02 });
  }
}
function shatter(x, y, w, h, col, power = 1) {
  P_({ k: 'glow', x, y, vx: 0, vy: 0, life: .18, max: .18, size: w * .7, col: '#fff' });
  P_({ k: 'ring', x, y, life: .35, max: .35, size: w * .8, col, lw: 3 });
  const n = 10 + (power * 4 | 0);
  for (let i = 0; i < n; i++) {
    const px = x + rand(-w / 2, w / 2), py = y + rand(-h / 2, h / 2);
    const a = Math.atan2(py - y, px - x) + rand(-.5, .5), v = rand(80, 320) * power;
    P_({ k: 'shard', x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v - rand(60, 200), g: 1100, life: rand(.6, 1.1), max: 1.1, w: rand(3, BW * .28), h: rand(2, BH * .4), col, rot: rand(0, TAU), vr: rand(-16, 16), drag: .4 });
  }
  for (let i = 0; i < 8; i++) {
    const a = rand(0, TAU), v = rand(80, 300);
    P_({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.15, .4), max: .4, size: 2, col: i % 2 ? '#fff' : col, drag: .03 });
  }
}
function popText(x, y, txt, col = '#fff', size = 18, life = 1, font = FONT) { texts.push({ x, y, txt, col, size, t: 0, life, font }); }
function updateParts(dt) {
  for (const p of parts) {
    p.life -= dt;
    if (p.g) p.vy += p.g * dt;
    if (p.drag) { const f = Math.pow(p.drag, dt); p.vx *= f; p.vy *= f; }
    p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt;
    if (p.vr) p.rot += p.vr * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.t += dt; t.y -= 40 * dt; }
  texts = texts.filter(t => t.t < t.life);
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'smoke') {
      ctx.globalAlpha = a * .45; ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.8 - a * .8), 0, TAU); ctx.fill();
    } else if (p.k === 'shard') {
      ctx.globalAlpha = Math.min(1, a * 1.6);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.moveTo(-p.w / 2, -p.h / 2); ctx.lineTo(p.w / 2, -p.h / 3); ctx.lineTo(p.w / 4, p.h / 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(-p.w / 2, -p.h / 2, p.w * .6, 1.2);
      ctx.restore();
    }
  }
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'spark') {
      ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); ctx.stroke();
    } else if (p.k === 'glow') {
      ctx.globalAlpha = a * .8; ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.1, p.size * a), 0, TAU); ctx.fill();
    } else if (p.k === 'ring') {
      const e = easeOutCubic(1 - a);
      ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = Math.max(.5, p.lw * a);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * e + 2, 0, TAU); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const s = t.t < .18 ? easeOutBack(t.t / .18) : 1;
    ctx.globalAlpha = clamp((t.life - t.t) / .3, 0, 1);
    ctx.save(); ctx.translate(clamp(t.x, 50, W - 50), t.y); ctx.scale(s, s);
    ctx.font = `900 ${t.size}px ${t.font}`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(t.txt, 0, 0);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ================= GAMEPLAY ================= */
function addScore(n) { score += n; scoreBump = 1; }
function hitBrick(k, dmg, x, y) {
  k.wob = 1;
  if (k.type === 'm') {
    k.flash = .12; sfx.metal(); sparks(x, y, 7, '#dfe8ff', 280);
    return;
  }
  k.hp -= dmg; k.flash = .1;
  if (k.hp <= 0) breakBrick(k);
  else { sfx.hit(); sparks(x, y, 6, bcol(k), 220); bgPulse = Math.min(1, bgPulse + .1); }
}
function breakBrick(k, silent) {
  if (k.dead) return;
  k.dead = true; grid[k.r * COLS + k.c] = null;
  const [x, y, w, h] = brect(k), cx = x + w / 2, cy = y + h / 2, col = k.type === 'x' ? '#ff5a3c' : HPC[k.maxhp];
  shatter(cx, cy, w, h, col, k.type === 'x' ? 1.5 : 1);
  if (silent) return;
  combo++; comboPop = 1; maxCombo = Math.max(maxCombo, combo);
  const pts = Math.round((k.type === 'x' ? 150 : 50 * k.maxhp) * (1 + Math.min(combo, 40) * .1) / 10) * 10;

  ctx.globalAlpha = clamp((t - 1.2) / .4, 0, 1) * (.55 + .45 * Math.sin(t * 5));
  const coarse = matchMedia('(pointer:coarse)').matches, st = coarse ? 'TAP TO START' : 'PRESS SPACE TO START';
  ctx.font = `900 ${fitFont(st, 20, W * .9, 0)}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.shadowColor = '#ff3cac'; ctx.shadowBlur = 15;
  ctx.fillText(st, W / 2, H * .46);
  ctx.shadowBlur = 0; ctx.globalAlpha = clamp((t - 1.3) / .4, 0, 1);
  if (best > 0) { ctx.font = `500 12px ${FONT}`; ctx.fillStyle = '#ffe58a'; ctx.fillText('BEST  ' + best, W / 2, H * .46 + 30); }
  // power-up legend
  const keysC = Object.keys(CAPS), cw = Math.min(78, (W - 20) / 5), lx = W / 2 - cw * 2;
  keysC.forEach((k, i) => {
    const p = clamp((t - 1.5 - i * .08) / .4, 0, 1); if (p <= 0) return;
    ctx.globalAlpha = p;
    const cx = lx + i * cw, cy = H * .62 + (1 - easeOutBack(p)) * 30 + Math.sin(t * 3 + i) * 3;
    drawCapsule(cx, cy, k, t + i, Math.min(1, cw / 60));
    ctx.globalAlpha = p; ctx.font = `700 11px ${KFONT}`; ctx.fillStyle = CAPS[k].col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(CAPS[k].ko, cx, cy + 22);
  });
  ctx.globalAlpha = clamp((t - 1.8) / .4, 0, 1) * .85;
  const ks = Math.min(13, W / 28);
  ctx.font = `500 ${ks}px ${KFONT}`; ctx.fillStyle = '#b8c6ff'; ctx.textAlign = 'center';
  const lines = ['이동: 마우스 · 방향키 · 터치 드래그', '발사: 클릭 · 스페이스 · 탭', '일시정지: P / ESC   ·   메뉴: M'];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H * .78 + i * (ks + 9)));
  ctx.globalAlpha = 1;
}
function drawGameOver() {
  const t = stateT;
  ctx.fillStyle = `rgba(5,0,15,${Math.min(.7, t * .6)})`; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'middle';
  const str = 'GAME OVER', sp = Math.min(8, W / 70), fs = fitFont(str, Math.min(80, W / 7), W * .9, sp);
  ctx.font = `900 ${fs}px ${FONT}`;
  const ws = [...str].map(c => ctx.measureText(c).width), tw = ws.reduce((a, b) => a + b, 0) + sp * (str.length - 1);
  let x = W / 2 - tw / 2;
  [...str].forEach((c, i) => {
    const p = clamp((t - i * .07) / .6, 0, 1);
    const y = H * .27 - (1 - easeOutBack(p)) * H * .3;
    ctx.globalAlpha = p; ctx.save(); ctx.translate(x + ws[i] / 2, y); ctx.rotate((1 - p) * (i % 2 ? .8 : -.8));
    ctx.shadowColor = '#ff3cac'; ctx.shadowBlur = 30; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(c, 0, 0);
    ctx.restore(); x += ws[i] + sp;
  });
  const rows = [['SCORE', score], ['STAGE', stageNum()], ['MAX COMBO', maxCombo], ['BEST', best]];
  rows.forEach(([k, v], i) => {
    const p = clamp((t - .8 - i * .15) / .4, 0, 1);
    ctx.globalAlpha = p;
    const y = H * .43 + i * 40, ox = (1 - easeOutCubic(p)) * 120 * (i % 2 ? 1 : -1);
    ctx.font = `500 13px ${FONT}`; ctx.fillStyle = '#9fb8ff'; ctx.textAlign = 'right'; ctx.fillText(k, W / 2 - 14 + ox, y);
    ctx.font = `900 22px ${FONT}`; ctx.fillStyle = k === 'BEST' && v === score && score > 0 ? '#ffe58a' : '#fff'; ctx.textAlign = 'left';
    const shown = k === 'SCORE' ? Math.round(score * easeOutCubic(clamp((t - .8) / 1.2, 0, 1))) : v;
    ctx.fillText(shown, W / 2 + 14 + ox, y);
  });
  ctx.textAlign = 'center';
  if (best === score && score > 0 && t > 2) {
    ctx.globalAlpha = .6 + .4 * Math.sin(t * 8);
    ctx.font = `900 16px ${FONT}`; ctx.fillStyle = '#ffe58a'; ctx.fillText('★ NEW RECORD ★', W / 2, H * .43 + 170);
  }
  if (t > 1.2) {
    ctx.globalAlpha = .5 + .5 * Math.sin(t * 5);
    const st = matchMedia('(pointer:coarse)').matches ? 'TAP TO RETRY' : 'PRESS SPACE TO RETRY';
    ctx.font = `900 ${fitFont(st, 16, W * .9, 0)}px ${FONT}`; ctx.fillStyle = '#fff';
    ctx.fillText(st, W / 2, H * .86);
    ctx.globalAlpha = .7; ctx.font = `500 12px ${KFONT}`; ctx.fillStyle = '#b8c6ff';
    ctx.fillText('M: 메인 메뉴', W / 2, H * .86 + 26);
  }
  ctx.globalAlpha = 1;
}

/* ================= MAIN LOOP ================= */
function update(dt, rdt) {
  updateBG(dt);
  stateT += rdt;
  if (state === 'title') { updateTitle(dt); updateParts(dt); return; }
  for (const k in fx) if (fx[k] > 0) fx[k] = Math.max(0, fx[k] - dt);
  if (introT > 0) introT -= dt;
  if (state === 'play') {
    updatePaddle(rdt);
    if (clearing) updateClear(dt);
    else {
      updateBalls(dt);
      if (!P.dead && balls.length === 0 && gameOverT <= 0) loseLife();
      if (!clearing && bricks.length && bricks.every(k => k.dead || k.type === 'm')) startClear();
    }
    updateLasers(dt);
    if (!P.dead) updateCaps(dt);
    if (gameOverT > 0) {
      gameOverT -= dt;
      if (gameOverT <= 0) { state = 'over'; stateT = 0; if (score > best) { best = score; try { localStorage.setItem('bricknova-best', best); } catch (_) {} } }
    }
  }
  updateBricks(dt);
  updateParts(dt);
}
let curCursor = '';
function render(rdt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBG();
  shakeAmt *= Math.pow(.004, rdt); if (shakeAmt < .1) shakeAmt = 0;
  if (state === 'title') { drawTitle(); }
  else {
    ctx.save();
    ctx.translate(rand(-1, 1) * shakeAmt, rand(-1, 1) * shakeAmt);
    drawFrame();
    drawBricks();
    drawSweep();
    for (const c of caps) drawCapsule(c.x, c.y, c.k, c.t);
    drawLasers();
    drawPaddle();
    drawBalls();
    drawParts();
    drawTexts();
    ctx.restore();
  }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (flashA > 0) { ctx.fillStyle = `rgba(${flashCol},${flashA})`; ctx.fillRect(0, 0, W, H); flashA = Math.max(0, flashA - rdt * 2.2); }
  if (state === 'play') drawHUD(rdt);
  if (state === 'play' || state === 'over') drawBanner(rdt);
  if (state === 'over') drawGameOver();
  if (state === 'title' || state === 'over') drawMenuBtn();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,10,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 40px ${FONT}`; ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ff3cac'; ctx.shadowBlur = 20; ctx.fillText('PAUSED', W / 2, H / 2); ctx.shadowBlur = 0;
    ctx.font = `500 14px ${KFONT}`; ctx.fillStyle = '#9fd8ff'; ctx.fillText('P 키 또는 화면을 눌러 계속', W / 2, H / 2 + 40);
  }
  const cur = state === 'play' && !paused ? 'none' : (menuHover ? 'pointer' : 'default');
  if (cur !== curCursor) { curCursor = cur; cv.style.cursor = cur; }
}
addEventListener('resize', resize); resize();
let last = performance.now();
function loop(now) {
  const rdt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    if (slowT > 0) { slowT -= rdt; timeScale = lerp(timeScale, .25, Math.min(1, rdt * 14)); }
    else timeScale = lerp(timeScale, 1, Math.min(1, rdt * 3));
    const dt = rdt * timeScale; T += dt;
    update(dt, rdt);
  }
  render(paused ? 0 : rdt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
