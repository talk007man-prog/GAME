<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Last Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05030f;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, vignette, ZOOM = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,.7)');
  ZOOM = Math.min(W, H) < 560 ? .78 : 1;
}
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const FONT = "'Orbitron','Segoe UI','Malgun Gothic',sans-serif";
const KFONT = "'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif";
const isTouch = () => matchMedia('(pointer:coarse)').matches;
const fmtTime = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

/* ================= AUDIO ================= */
let AC = null, MG = null, NB = null, lastShotS = 0, lastBoomS = 0, lastHitS = 0, lastGemS = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MG = AC.createGain(); MG.gain.value = .45; MG.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f1, f2, dur, vol, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t, Math.random()); s.stop(t + dur);
}
const sfx = {
  shot() { if (!AC || AC.currentTime - lastShotS < .07) return; lastShotS = AC.currentTime; tone('square', 900, 260, .06, .018); },
  boom(s) { if (!AC || AC.currentTime - lastBoomS < .04) return; lastBoomS = AC.currentTime; noise(.2 + s * .2, Math.min(.45, .1 + s * .1), 800 + s * 200); if (s > 2) tone('sine', 130, 30, .5, .3); },
  hit() { if (!AC || AC.currentTime - lastHitS < .035) return; lastHitS = AC.currentTime; tone('square', 320, 110, .04, .025); },
  gem() { if (!AC || AC.currentTime - lastGemS < .03) return; lastGemS = AC.currentTime; tone('sine', 1300 + Math.random() * 600, 2300, .05, .025); },
  hurt() { tone('sawtooth', 300, 60, .35, .16); noise(.4, .3, 1200); },
  heal() { tone('sine', 520, 1300, .25, .12); tone('triangle', 780, 1560, .25, .06, .08); },
  lvl() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f * 1.01, .3, .1, i * .07)); },
  pick() { tone('sine', 700, 1700, .3, .14); noise(.25, .12, 4000); },
  warn() { tone('square', 520, 500, .25, .06); },
  dash() { tone('sawtooth', 160, 900, .3, .05); },
  over() { tone('sawtooth', 400, 40, 1.4, .2); noise(1.4, .5, 600); tone('sine', 90, 20, 1.5, .5); }
};

/* ================= INPUT ================= */
const keys = {};
let mx = -999, my = -999;
let joy = { on: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 };
const MENU_BTN = { x: 14, y: 14, w: 104, h: 38 };
const inMenuBtn = (x, y) => x >= MENU_BTN.x && x <= MENU_BTN.x + MENU_BTN.w && y >= MENU_BTN.y && y <= MENU_BTN.y + MENU_BTN.h;
const pauseBtn = () => ({ x: W - 36, y: 112, r: 18 });
function goMenu() { location.href = 'index.html'; }
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  initAudio();
  if (state === 'title' || state === 'over') {
    if (e.code === 'KeyM') { goMenu(); return; }
    if ((e.code === 'Space' || e.code === 'Enter') && canStart()) { startGame(); return; }
  }
  if (state === 'play') {
    if (lvlUp) {
      const i = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code];
      if (i !== undefined) pickCard(i);
      return;
    }
    if ((e.code === 'KeyP' || e.code === 'Escape') && P && !P.dead) paused = !paused;
  }
});
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('pointerdown', e => {
  initAudio(); mx = e.clientX; my = e.clientY;
  if (state === 'title' || state === 'over') {
    if (inMenuBtn(mx, my)) { goMenu(); return; }
    if (canStart()) startGame();
    return;
  }
  if (state === 'play') {
    if (lvlUp) { const i = cardAt(mx, my); if (i >= 0) pickCard(i); return; }
    if (paused) { paused = false; return; }
    const pb = pauseBtn();
    if (isTouch() && Math.hypot(mx - pb.x, my - pb.y) < pb.r + 8) { paused = true; return; }
    if (!joy.on) {
      joy = { on: true, id: e.pointerId, ox: mx, oy: my, x: mx, y: my, t: 0 };
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    }
  }
});
cv.addEventListener('pointermove', e => {
  mx = e.clientX; my = e.clientY;
  if (joy.on && e.pointerId === joy.id) { joy.x = mx; joy.y = my; }
});
const ptrUp = e => { if (joy.on && e.pointerId === joy.id) joy.on = false; };
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
addEventListener('blur', () => { if (state === 'play' && !lvlUp && P && !P.dead) paused = true; for (const k in keys) keys[k] = false; joy.on = false; });

/* ================= STATE ================= */
let state = 'title', paused = false, T = 0, stateT = 0;
let P = null, bullets = [], ebullets = [], enemies = [], parts = [], gems = [], items = [], texts = [];
let survT = 0, kills = 0, level = 1, xp = 0, xpDisp = 0, lvPend = 0, lvlUp = null, spawnT = 0, nextElite = 60, eliteWarned = false, nextSwarm = 30;
let camX = 0, camY = 0, zoomPunch = 0;
let shakeAmt = 0, flashA = 0, flashCol = '255,255,255', timeScale = 1, slowT = 0;
let banner = null, gameOverT = 0, finalScore = 0, newRecord = false, eliteRef = null, eliteHpLag = 1, auraPulse = 0;
let best = 0; try { best = +localStorage.getItem('lastorbit-best') || 0; } catch (_) {}
const canStart = () => state === 'title' || (state === 'over' && stateT > 1.2);
const xpNeed = l => Math.floor(5 + l * 4 + l * l * .35);

function startGame() {
  P = { x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxhp: 100, hpLag: 100, inv: 1, fireCD: .3, aim: 0, face: 0, hurt: 0,
    rate: .46, dmg: 1, multi: 1, speed: 235, magnet: 95, regen: 0, blades: 0, aura: 0, bladeA: 0, auraT: 0, recoil: 0, dead: false, lv: {} };
  bullets = []; ebullets = []; enemies = []; gems = []; items = []; texts = [];
  survT = 0; kills = 0; level = 1; xp = 0; xpDisp = 0; lvPend = 0; lvlUp = null; spawnT = .5; nextElite = 60; eliteWarned = false; nextSwarm = 30;
  camX = 0; camY = 0; gameOverT = 0; paused = false; state = 'play'; stateT = 0; eliteRef = null; zoomPunch = .25;
  flashA = .5; flashCol = '120,220,255';
  for (let i = 0; i < 3; i++) P_({ k: 'ring', x: 0, y: 0, life: .6 + i * .2, max: .6 + i * .2, size: 160 + i * 90, col: i % 2 ? '#fff' : '#3cf', lw: 6 });
  banner = { t: 0, dur: 2.4, kind: 'wave', text: 'SURVIVE', sub: '최대한 오래 살아남아라' };
}

/* ================= UPGRADES ================= */
const UPG = {
  rate:   { name: '연사 속도', col: '#3cf',    max: 8, desc: l => '발사 간격 15% 감소' },
  multi:  { name: '멀티샷',    col: '#ffe14d', max: 6, desc: l => '한 번에 탄환 +1발 확산 발사' },
  dmg:    { name: '공격력',    col: '#ff5a6a', max: 8, desc: l => '모든 공격 피해 +25%' },
  blade:  { name: '궤도 칼날', col: '#ff6ad5', max: 6, desc: l => l ? '칼날 +1개, 회전 속도 증가' : '주위를 도는 칼날이 적을 벤다' },
  aura:   { name: '파동 오라', col: '#5cff9d', max: 6, desc: l => l ? '오라 범위와 피해 증가' : '주변 적에게 지속 피해를 준다' },
  speed:  { name: '이동 속도', col: '#b48bff', max: 5, desc: l => '이동 속도 +12%' },
  hp:     { name: '강화 장갑', col: '#ff8a3c', max: 6, desc: l => '최대 체력 +25, 체력 모두 회복' },
  regen:  { name: '나노 재생', col: '#7fffd4', max: 5, desc: l => '초당 체력 0.8 자동 회복' },
  magnet: { name: '중력 자석', col: '#4df0ff', max: 5, desc: l => '경험치 흡수 범위 +40%' }
};
function applyUpg(k) {
  P.lv[k] = (P.lv[k] || 0) + 1;
  switch (k) {
    case 'rate': P.rate *= .85; break;
    case 'multi': P.multi++; break;
    case 'dmg': P.dmg += .25; break;
    case 'blade': P.blades++; break;
    case 'aura': P.aura++; break;
    case 'speed': P.speed *= 1.12; break;
    case 'hp': P.maxhp += 25; P.hp = P.maxhp; break;
    case 'regen': P.regen += .8; break;
    case 'magnet': P.magnet *= 1.4; break;
  }
}
function openLevelUp() {
  const pool = Object.keys(UPG).filter(k => (P.lv[k] || 0) < UPG[k].max);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const ch = pool.slice(0, 3);
  lvPend--;
  if (!ch.length) { P.hp = P.maxhp; popText(P.x, P.y - 50, 'FULL HEAL', '#5cff9d', 20, 1.2); return; }
  lvlUp = { t: 0, ch, pick: -1, pt: 0 };
  sfx.lvl(); flashA = .35; flashCol = '120,240,255';
  for (let i = 0; i < 3; i++) P_({ k: 'ring', x: P.x, y: P.y, life: .5 + i * .15, max: .5 + i * .15, size: 120 + i * 80, col: ['#fff', '#3cf', '#ffe14d'][i], lw: 6 });
  for (const e of enemies) {
    const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1;
    if (d < 260 && e.type !== 'elite') { e.kx += dx / d * 520; e.ky += dy / d * 520; }
  }
}
function cardRects() {
  const n = lvlUp ? lvlUp.ch.length : 3, rs = [];
  if (W >= 640) {
    const cw = Math.min(220, (W - 80) / 3), ch = Math.min(290, H * .55), gap = 22;
    const tw = n * cw + (n - 1) * gap, x0 = W / 2 - tw / 2, y = H * .54 - ch / 2;
    for (let i = 0; i < n; i++) rs.push({ x: x0 + i * (cw + gap), y, w: cw, h: ch, v: false });
  } else {
    const cw = Math.min(W - 28, 400), ch = Math.min(104, (H - 190) / 3), gap = 12;
    const th = n * ch + (n - 1) * gap, y0 = Math.max(120, H * .56 - th / 2);
    for (let i = 0; i < n; i++) rs.push({ x: W / 2 - cw / 2, y: y0 + i * (ch + gap), w: cw, h: ch, v: true });
  }
  return rs;
}
function cardAt(x, y) {
  if (!lvlUp || lvlUp.pick >= 0 || lvlUp.t < .45) return -1;
  const rs = cardRects();
  for (let i = 0; i < rs.length; i++) { const r = rs[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i; }
  return -1;
}
function pickCard(i) {
  if (!lvlUp || lvlUp.pick >= 0 || lvlUp.t < .45 || i >= lvlUp.ch.length) return;
  lvlUp.pick = i; lvlUp.pt = 0;
  const k = lvlUp.ch[i]; applyUpg(k); sfx.pick();
  flashA = .3; flashCol = '255,255,255';
}

/* ================= PARTICLES ================= */
function P_(o) { if (parts.length < 1600) parts.push(o); }
function explode(x, y, s = 1, col = '#ffb347') {
  P_({ k: 'glow', x, y, vx: 0, vy: 0, life: .22, max: .22, size: 40 * s, col: '#fff' });
  P_({ k: 'ring', x, y, life: .45, max: .45, size: 50 * s, col, lw: 6 * s });
  if (s > 2) P_({ k: 'ring', x, y, life: .9, max: .9, size: 130 * s, col: '#fff', lw: 3 });
  const n = Math.min(60, 12 * s | 0), cols = ['#fff', '#ffe58a', col, col];
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(120, 500) * Math.sqrt(s);
    P_({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.2, .6), max: .6, size: rand(1.5, 3), col: cols[i % 4], drag: .03 });
  }
  for (let i = 0; i < 5 * s; i++) {
    const a = rand(0, TAU), v = rand(20, 150) * Math.sqrt(s);
    P_({ k: 'glow', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.3, .6), max: .6, size: rand(7, 18) * s, col: i % 2 ? col : '#ffcf6b', drag: .08 });
  }
  for (let i = 0; i < 3 * s; i++) {
    const a = rand(0, TAU), v = rand(10, 60) * s;
    P_({ k: 'smoke', x: x + rand(-8, 8) * s, y: y + rand(-8, 8) * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.7, 1.3), max: 1.3, size: rand(8, 18) * s, col: '#2a2440', drag: .2 });
  }
  for (let i = 0; i < 5 * s; i++) {
    const a = rand(0, TAU), v = rand(80, 300);
    P_({ k: 'debris', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.4, 1), max: 1, size: rand(2, 6), col, rot: rand(0, TAU), vr: rand(-15, 15), drag: .12 });
  }
  shakeAmt = Math.min(30, shakeAmt + 2.2 * s);
  sfx.boom(s);
}
function sparks(x, y, n, col, sp = 250) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(60, sp);
    P_({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.1, .3), max: .3, size: 1.5, col, drag: .02 });
  }
}
function popText(x, y, txt, col = '#fff', size = 18, life = 1) {
  if (texts.length > 140) texts.shift();
  texts.push({ x: x + rand(-6, 6), y, txt, col, size, t: 0, life, vx: rand(-30, 30) });
}
function updateParts(dt) {
  for (const p of parts) {
    p.life -= dt;
    if (p.drag) { const f = Math.pow(p.drag, dt); p.vx *= f; p.vy *= f; }
    p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt;
    if (p.vr) p.rot += p.vr * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.t += dt; t.y -= 46 * dt * (1 - t.t / t.life); t.x += t.vx * dt; }
  texts = texts.filter(t => t.t < t.life);
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'smoke') {
      ctx.globalAlpha = a * .45; ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.8 - a * .8), 0, TAU); ctx.fill();
    } else if (p.k === 'debris') {
      ctx.globalAlpha = a; ctx.fillStyle = p.col;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    }
  }
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'spark') {
      ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .035, p.y - p.vy * .035); ctx.stroke();
    } else if (p.k === 'glow') {
      ctx.globalAlpha = a * .8; ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.1, p.size * a), 0, TAU); ctx.fill();
    } else if (p.k === 'ring') {
      const e = easeOutCubic(1 - a);
      ctx.globalAlpha = a; ctx.strokeStyle = p.col; ctx.lineWidth = Math.max(.5, p.lw * a);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * e + 2, 0, TAU); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const s = t.t < .15 ? easeOutBack(t.t / .15) * 1.3 : lerp(1.3, 1, clamp((t.t - .15) / .15, 0, 1));
    ctx.globalAlpha = clamp((t.life - t.t) / .3, 0, 1);
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(s, s);
    ctx.font = `900 ${t.size}px ${FONT}`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.strokeText(t.txt, 0, 0);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ================= PLAYER ================= */
function drawPlayer(x, y, face, aim, alpha = 1, hurt = 0, recoil = 0) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
  // orbit ring
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(60,200,255,.35)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 7]);
  ctx.save(); ctx.rotate(T * 1.2); ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.stroke(); ctx.restore();
  ctx.setLineDash([]);
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 44);
  gl.addColorStop(0, 'rgba(60,200,255,.35)'); gl.addColorStop(1, 'rgba(60,200,255,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, 44, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  // body (hull rotates with movement)
  ctx.save(); ctx.rotate(face);
  ctx.shadowColor = hurt > 0 ? '#f35' : '#3cf'; ctx.shadowBlur = 16;
  const bg = ctx.createLinearGradient(-18, -18, 18, 18);
  bg.addColorStop(0, '#e8fbff'); bg.addColorStop(1, '#2a8fd0');
  ctx.fillStyle = hurt > 0 ? '#fff' : bg;
  ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(4, 7); ctx.lineTo(-12, 16); ctx.lineTo(-8, 0); ctx.lineTo(-12, -16); ctx.lineTo(4, -7); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#20b8ff'; ctx.beginPath(); ctx.moveTo(-4, 9); ctx.lineTo(-12, 16); ctx.lineTo(-9, 6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4, -9); ctx.lineTo(-12, -16); ctx.lineTo(-9, -6); ctx.fill();
  ctx.restore();
  // turret
  ctx.save(); ctx.rotate(aim);
  ctx.fillStyle = '#0b2140'; ctx.strokeStyle = '#9ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#dff'; ctx.fillRect(4 - recoil * 5, -2.5, 13, 5);
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 2.5 + Math.sin(T * 8) * .6, 0, TAU); ctx.fill();

  if (flashA > 0) { ctx.fillStyle = `rgba(${flashCol},${flashA})`; ctx.fillRect(0, 0, W, H); flashA = Math.max(0, flashA - rdt * 2.2); }
  if (state === 'play') { drawHUD(rdt); drawJoystick(); }
  if (state === 'play' || state === 'over') drawBanner(rdt);
  if (state === 'play') drawLevelUp(rdt);
  if (state === 'over') drawGameOver();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,10,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 40px ${FONT}`; ctx.fillStyle = '#fff';
    ctx.shadowColor = '#3cf'; ctx.shadowBlur = 20; ctx.fillText('PAUSED', W / 2, H / 2); ctx.shadowBlur = 0;
    ctx.font = `500 14px ${KFONT}`; ctx.fillStyle = '#9fd8ff'; ctx.fillText('P / ESC 키 또는 화면을 눌러 계속', W / 2, H / 2 + 40);
  }
}
let last = performance.now();
function loop(now) {
  const rdt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    if (slowT > 0) { slowT -= rdt; timeScale = lerp(timeScale, .25, Math.min(1, rdt * 14)); }
    else timeScale = lerp(timeScale, 1, Math.min(1, rdt * 3));
    const dt = lvlUp ? 0 : rdt * timeScale; T += lvlUp ? rdt : dt;
    update(dt, rdt);
  }
  render(paused ? 0 : rdt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
